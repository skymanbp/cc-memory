[project]
name = "cc-memory"
version = "2.13.0"
description = "Persistent memory for Claude Code: anti-patch reconcile-on-write + LLM-judged semantic de-duplication, forced PROGRESS.md handoff with per-session annotation, live PLAN.md anchor, injection observability, FTS5 search, AI-judged extraction with Haiku + Ollama fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "skymanbp" }]
keywords = [
    "claude-code",
    "claude-code-plugin",
    "claude",
    "anthropic",
    "memory",
    "persistent-memory",
    "long-term-memory",
    "agent-memory",
    "llm-memory",
    "context-management",
    "context-window",
    "compaction",
    "session-handoff",
    "ai-agent",
    "coding-agent",
    "mcp",
    "model-context-protocol",
    "hooks",
    "sqlite",
    "fts5",
    "full-text-search",
    "anti-patch",
    "prompt-injection",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skymanbp/cc-memory"
Repository = "https://github.com/skymanbp/cc-memory"
Documentation = "https://github.com/skymanbp/cc-memory/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/skymanbp/cc-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/skymanbp/cc-memory/issues"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
cc-memory = "cc_memory.cli.mem:main"
cc-memory-plan = "cc_memory.cli.plan:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cc_memory*"]

[tool.setuptools.package-data]
cc_memory = ["config.json"]
