name: release gates

# The ten release gates were ten commands in a markdown list, run by hand.
# The v2.11.0 release commit shipped with tests/smoke_test.py RED because of
# it. This workflow is what makes "run all ten" an executable rather than a
# sentence.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows is this project's primary platform (CLAUDE.md), it is where the
  # gates are developed and verified, and it is the only OS where the whole
  # set is known to pass. So it runs the WHOLE set.
  full:
    name: all 11 gates (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: no pip install step is required
        run: python -c "import sys; print(sys.version)"
        # cc-memory is pure standard library at runtime AND in every gate.
        # If this job ever needs a `pip install`, that is a defect in the
        # change that introduced it, not a missing step here.
      - name: run every release gate
        run: python tests/run_gates.py

  # Linux runs the FULL set too. It used to run only the fast subset with a
  # comment explaining that smoke_test/test_surfaces "drive a Tk dashboard
  # headlessly and exercise Windows-specific path shapes" — which was an
  # assumption, never a measurement, and it left the single largest unknown in
  # the project: whether cc-memory works on Linux at all. `python3-tk` is the
  # one real dependency those suites need; everything else is standard library.
  linux:
    name: all 11 gates (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install tkinter (the dashboard suite drives it headlessly)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: run every release gate
        run: python tests/run_gates.py

  # A gate that cannot go red is a gate that is lying. tools/falsify_fixes.py
  # reverts each registered fix on a TEMPORARY COPY and asserts the gate
  # catches it. --anchors is the cheap half: it proves the register itself has
  # not rotted against the tree, without running the full revert matrix.
  falsify-anchors:
    name: falsification register is not rotted
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/falsify_fixes.py --anchors
